<!-- templates/login.html -->

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {

            background: #111827;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .card {

            width: 400px;
            border-radius: 20px;
            background: #1f2937;
            color: white;

        }

    </style>

</head>

<body>

<div class="card p-5 shadow">

    <h1 class="text-center mb-4">
        ⚽ Pelada Pro
    </h1>

    <form method="POST" action="/logar">

        <input
            type="text"
            name="usuario"
            class="form-control mb-3"
            placeholder="Usuário"
        >

        <input
            type="password"
            name="senha"
            class="form-control mb-3"
            placeholder="Senha"
        >

        <button class="btn btn-success w-100">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
