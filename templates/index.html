<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container mt-4 mb-5">

    <!-- TITULO -->

    <h1 class="titulo mb-4">
        Futebol dos Amigos ⚽
    </h1>

    <!-- CADASTRO -->

    <div class="card shadow-sm p-4 mb-4">

        <h4 class="mb-3">
            Cadastrar Jogador
        </h4>

        <div class="row g-3">

            <div class="col-md-4">

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Nome do jogador"
                >

            </div>

            <div class="col-md-3">

                <select
                    id="posicao"
                    class="form-select"
                >

                    <option value="A">
                        Atacante
                    </option>

                    <option value="M">
                        Meia
                    </option>

                    <option value="Z">
                        Zagueiro
                    </option>

                    <option value="G">
                        Goleiro
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    step="0.1"
                    id="nota"
                    class="form-control"
                    placeholder="Nota"
                >

            </div>

            <div class="col-md-3">

                <button
                    onclick="addJogador()"
                    class="btn btn-success w-100"
                >
                    ➕ Adicionar Jogador
                </button>

            </div>

        </div>

    </div>

    <!-- CONTADOR -->

    <div
        class="contador mb-4"
        id="contadorSelecionados"
    >
        Selecionados: 0
    </div>

    <!-- BOTÕES -->

    <div class="d-flex flex-wrap gap-3 mb-4">

        <button
            onclick="sortear()"
            class="btn btn-primary"
        >
            ⚽ Sortear Times
        </button>

        <button
            onclick="registrarJogos()"
            class="btn btn-success"
        >
            🎮 Registrar Jogos
        </button>

        <button
            onclick="copiarTimes()"
            class="btn btn-dark"
        >
            📋 Copiar Times
        </button>

        <button
            onclick="baixarImagem()"
            class="btn btn-warning"
        >
            📸 Baixar Imagem
        </button>

    </div>

    <!-- RANKING TIMES -->

    <div class="card shadow-sm p-4 mb-4">

        <h3 class="mb-3">
            🏆 Ranking dos Times
        </h3>

        <div id="rankingTimes"></div>

    </div>

    <!-- JOGADORES -->

    <div class="card shadow-sm p-4 mb-4">

        <h3 class="mb-3">
            ⚽ Ranking Jogadores
        </h3>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th></th>
                        <th>Nome</th>
                        <th>Posição</th>
                        <th>Gols</th>
                        <th>Jogos</th>
                        <th>Vitórias</th>
                        <th>Nota</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaJogadores"></tbody>

            </table>

        </div>

    </div>

    <!-- GOLEIROS -->

    <div class="card shadow-sm p-4 mb-4">

        <h3 class="mb-3">
            🧤 Ranking Goleiros
        </h3>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th></th>
                        <th>Nome</th>
                        <th>Posição</th>
                        <th>Gols Sofridos</th>
                        <th>Jogos</th>
                        <th>Vitórias</th>
                        <th>Nota</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaGoleiros"></tbody>

            </table>

        </div>

    </div>

    <!-- ÁREA DOS TIMES -->

    <div
        id="areaTimes"
        class="area-times"
    >

        <div class="row">

            <!-- TIME 1 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🔵 Time 1
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime1"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time1"
                    ></div>

                    <div class="area-botoes-time">

                        <button
                            class="btn-vitoria"
                            onclick="salvarVitoria(1)"
                        >
                            🏆 Registrar Vitória
                        </button>

                    </div>

                </div>

            </div>

            <!-- TIME 2 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🔴 Time 2
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime2"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time2"
                    ></div>

                    <div class="area-botoes-time">

                        <button
                            class="btn-vitoria"
                            onclick="salvarVitoria(2)"
                        >
                            🏆 Registrar Vitória
                        </button>

                    </div>

                </div>

            </div>

            <!-- TIME 3 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🟢 Time 3
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime3"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time3"
                    ></div>

                    <div class="area-botoes-time">

                        <button
                            class="btn-vitoria"
                            onclick="salvarVitoria(3)"
                        >
                            🏆 Registrar Vitória
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- HTML2CANVAS -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<!-- SCRIPT PRINCIPAL -->

<script src="/static/script.js"></script>

</body>
</html>
