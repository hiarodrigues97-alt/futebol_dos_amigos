<!-- templates/index.html -->

<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container mt-4">

    <h1 class="titulo">
        Futebol dos Amigos ⚽
    </h1>

    <!-- CADASTRO -->

    <div class="card p-4 mb-4">

        <div class="row g-3">

            <div class="col-md-4">

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Nome"
                >

            </div>

            <div class="col-md-3">

                <select
                    id="posicao"
                    class="form-select"
                >

                    <option value="A">Atacante</option>
                    <option value="M">Meia</option>
                    <option value="Z">Zagueiro</option>
                    <option value="G">Goleiro</option>

                </select>

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    id="nota"
                    class="form-control"
                    step="0.1"
                    placeholder="Nota"
                >

            </div>

            <div class="col-md-3">

                <button
                    onclick="addJogador()"
                    class="btn btn-success w-100"
                >
                    Adicionar
                </button>

            </div>

        </div>

    </div>

    <!-- CONTADOR -->

    <div
        class="contador"
        id="contadorSelecionados"
    >
        Selecionados: 0
    </div>

    <!-- BOTÕES -->

    <div class="d-flex gap-2 flex-wrap mb-4">

        <button
            onclick="sortear()"
            class="btn btn-primary"
        >
            ⚽ Sortear
        </button>

        <button
            onclick="registrarJogos()"
            class="btn btn-success"
        >
            🎮 Registrar Jogos
        </button>

        <button
            onclick="copiarTimes()"
            class="btn btn-dark"
        >
            📋 Copiar
        </button>

        <button
            onclick="baixarImagem()"
            class="btn btn-warning"
        >
            📸 Imagem
        </button>

    </div>

    <!-- RANKING -->

    <div class="card p-4 mb-4">

        <h3 class="mb-3">
            🏆 Ranking Times
        </h3>

        <div id="rankingTimes"></div>

    </div>

    <!-- DASHBOARD -->

    <div class="row mb-4">

        <div class="col-lg-6">

            <div class="card p-4 h-100">

                <h3 class="mb-3">
                    ⚽ Top 5 Artilheiros
                </h3>

                <div id="graficoArtilheiros"></div>

            </div>

        </div>

        <div class="col-lg-6">

            <div class="card p-4 h-100">

                <h3 class="mb-3">
                    🧤 Goleiros Menos Vazados
                </h3>

                <div id="graficoGoleiros"></div>

            </div>

        </div>

    </div>

    <!-- TABELAS -->

    <div class="row">

        <!-- JOGADORES -->

        <div class="col-lg-8">

            <div class="card p-4 mb-4">

                <h3 class="mb-3">
                    ⚽ Jogadores
                </h3>

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th></th>
                                <th>Nome</th>
                                <th>Pos</th>
                                <th>Gols</th>
                                <th>Jogos</th>
                                <th>Vitórias</th>
                                <th>Nota</th>
                                <th>Ações</th>

                            </tr>

                        </thead>

                        <tbody id="listaJogadores"></tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- GOLEIROS -->

        <div class="col-lg-4">

            <div class="card p-4 mb-4">

                <h3 class="mb-3">
                    🧤 Goleiros
                </h3>

                <div class="table-responsive">

                    <table class="table align-middle">

                        <thead>

                            <tr>

                                <th></th>
                                <th>Nome</th>
                                <th>GS</th>
                                <th>Jogos</th>

                            </tr>

                        </thead>

                        <tbody id="listaGoleiros"></tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- TIMES -->

    <div
        class="area-times"
        id="areaTimes"
    >

        <div class="row">

            <!-- TIME 1 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🔵 TIME 1
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime1"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time1"
                    ></div>

                    <button
                        class="btn-vitoria"
                        onclick="salvarVitoria('TIME 1')"
                    >
                        🏆 Vitória
                    </button>

                </div>

            </div>

            <!-- TIME 2 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🔴 TIME 2
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime2"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time2"
                    ></div>

                    <button
                        class="btn-vitoria"
                        onclick="salvarVitoria('TIME 2')"
                    >
                        🏆 Vitória
                    </button>

                </div>

            </div>

            <!-- TIME 3 -->

            <div class="col-lg-4 mb-4">

                <div class="card-time">

                    <div class="topo-time">

                        <h3>
                            🟢 TIME 3
                        </h3>

                        <div
                            class="nota-time"
                            id="notaTime3"
                        >
                            Nota: 0
                        </div>

                    </div>

                    <div
                        class="campo"
                        id="time3"
                    ></div>

                    <button
                        class="btn-vitoria"
                        onclick="salvarVitoria('TIME 3')"
                    >
                        🏆 Vitória
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- SCRIPTS -->

<script src="/static/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
