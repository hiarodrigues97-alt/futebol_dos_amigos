<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol dos Amigos</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">
    <main class="container py-4">
        <h1 class="text-center mb-4">⚽ Futebol dos Amigos</h1>

        <section class="card mb-4" aria-labelledby="titulo-cadastro">
            <div class="card-body">
                <h2 id="titulo-cadastro" class="h5 mb-3">Novo Jogador</h2>

                <div class="row g-2">
                    <div class="col-md-5">
                        <label class="visually-hidden" for="nome">Nome</label>
                        <input
                            type="text"
                            id="nome"
                            class="form-control"
                            placeholder="Nome"
                            maxlength="100"
                            autocomplete="name"
                        >
                    </div>

                    <div class="col-md-3">
                        <label class="visually-hidden" for="posicao">Posição</label>
                        <select id="posicao" class="form-select">
                            <option value="A">Atacante</option>
                            <option value="M">Meia</option>
                            <option value="Z">Zagueiro</option>
                            <option value="G">Goleiro</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label class="visually-hidden" for="nota">Nota</label>
                        <input
                            type="number"
                            id="nota"
                            class="form-control"
                            step="0.1"
                            min="0"
                            placeholder="Nota"
                        >
                    </div>

                    <div class="col-md-2">
                        <button class="btn btn-success w-100" type="button" onclick="addJogador()">
                            Salvar
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <div class="mb-4">
            <button class="btn btn-warning" type="button" onclick="gerarTop10()">
                🏆 Gerar Imagem Top 10
            </button>
        </div>

        <section class="card mb-4" aria-labelledby="titulo-ranking">
            <div class="card-body">
                <h2 id="titulo-ranking" class="h5">🏆 Top 10 Artilheiros</h2>
                <div id="ranking"></div>
            </div>
        </section>

        <section class="card mb-4" aria-labelledby="titulo-linha">
            <div class="card-body">
                <h2 id="titulo-linha" class="h5">⚽ Jogadores de Linha</h2>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Pos</th>
                                <th>⚽ Gols</th>
                                <th>🎮 Jogos</th>
                                <th>🏆 Vitórias</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaJogadores"></tbody>
                    </table>
                </div>
            </div>
