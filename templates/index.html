
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container py-4">

    <h1 class="text-center mb-4">
        ⚽ Futebol dos Amigos
    </h1>

    <!-- Cadastro -->

    <div class="card mb-4">

        <div class="card-body">

            <h5 class="mb-3">
                Novo Jogador
            </h5>

            <div class="row g-2">

                <div class="col-md-5">

                    <input
                        type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Nome"
                    >

                </div>

                <div class="col-md-3">

                    <select
                        id="posicao"
                        class="form-select"
                    >
                        <option value="A">Atacante</option>
                        <option value="M">Meia</option>
                        <option value="Z">Zagueiro</option>
                        <option value="G">Goleiro</option>
                    </select>

                </div>

                <div class="col-md-2">

                    <input
                        type="number"
                        id="nota"
                        class="form-control"
                        step="0.1"
                        placeholder="Nota"
                    >

                </div>

                <div class="col-md-2">

                    <button
                        class="btn btn-success w-100"
                        onclick="addJogador()"
                    >
                        Salvar
                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Ações -->

    <div class="mb-4">

        <button
            class="btn btn-warning"
            onclick="gerarTop10()"
        >
            🏆 Gerar Imagem Top 10
        </button>

    </div>

    <!-- Ranking -->

    <div class="card mb-4">

        <div class="card-body">

            <h5>
                🏆 Top 10 Artilheiros
            </h5>

            <div id="ranking"></div>

        </div>

    </div>

    <!-- Jogadores de Linha -->

    <div class="card mb-4">

        <div class="card-body">

            <h5>
                ⚽ Jogadores de Linha
            </h5>

            <div class="table-responsive">

                <table class="table table-striped">

                    <thead>

                        <tr>

                            <th>Nome</th>
                            <th>Pos</th>
                            <th>⚽ Gols</th>
                            <th>🎮 Jogos</th>
                            <th>🏆 Vitórias</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="listaJogadores"></tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Goleiros -->

    <div class="card mb-4">

        <div class="card-body">

            <h5>
                🧤 Goleiros
            </h5>

            <div class="table-responsive">

                <table class="table table-striped">

                    <thead>

                        <tr>

                            <th>Nome</th>
                            <th>🎮 Jogos</th>
                            <th>🏆 Vitórias</th>
                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody id="listaGoleiros"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
