<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container mt-4">

    <h1 class="titulo">
        Futebol dos Amigos ⚽
    </h1>

    <!-- CADASTRO -->

    <div class="card p-4 mb-4">

        <h4 class="mb-3">
            Cadastrar Jogador
        </h4>

        <div class="row g-3">

            <div class="col-md-4">

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Nome"
                >

            </div>

            <div class="col-md-2">

                <select
                    id="posicao"
                    class="form-control"
                >

                    <option value="A">Atacante</option>

                    <option value="M">Meia</option>

                    <option value="Z">Zagueiro</option>

                    <option value="G">Goleiro</option>

                </select>

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    step="0.1"
                    id="nota"
                    class="form-control"
                    placeholder="Nota"
                >

            </div>

            <div class="col-md-2">

                <button
                    onclick="addJogador()"
                    class="btn btn-success w-100"
                >
                    Adicionar
                </button>

            </div>

            <div class="col-md-2">

                <button
                    onclick="sortear()"
                    class="btn btn-primary w-100"
                >
                    Sortear
                </button>

            </div>

        </div>

    </div>

    <!-- CONTADOR -->

    <div
        class="contador"
        id="contadorSelecionados"
    >
        Selecionados: 0
    </div>

    <!-- RANKING TIMES -->

    <div class="card p-4 mb-4">

        <h4>
            Ranking de Times 🏆
        </h4>

        <div id="rankingTimes"></div>

    </div>

    <!-- JOGADORES LINHA -->

    <div class="card p-4 mb-4">

        <h4>
            Ranking Artilheiros ⚽
        </h4>

        <div class="table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th></th>

                        <th>Nome</th>

                        <th>Posição</th>

                        <th>Gols</th>

                        <th>Jogos</th>

                        <th>Vitórias</th>

                        <th>Nota</th>

                    </tr>

                </thead>

                <tbody id="listaJogadores"></tbody>

            </table>

        </div>

    </div>

    <!-- GOLEIROS -->

    <div class="card p-4 mb-4">

        <h4>
            Ranking Goleiros 🧤
        </h4>

        <div class="table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th></th>

                        <th>Nome</th>

                        <th>Posição</th>

                        <th>Gols Sofridos</th>

                        <th>Jogos</th>

                        <th>Vitórias</th>

                        <th>Nota</th>

                    </tr>

                </thead>

                <tbody id="listaGoleiros"></tbody>

            </table>

        </div>

    </div>

    <!-- BOTÕES GERAIS -->

    <div class="row mb-4">

        <div class="col-md-6">

            <button
                onclick="registrarJogos()"
                class="btn-jogo"
            >
                🎮 Registrar Jogos
            </button>

        </div>

        <div class="col-md-6">

            <button
                onclick="copiarTimes()"
                class="btn-copiar"
            >
                📋 Copiar Times
            </button>

        </div>

    </div>

    <!-- ÁREA DOS TIMES -->

    <div
        class="row area-times"
        id="areaTimes"
    >

        <!-- TIME 1 -->

        <div class="col-lg-4 mb-4">

            <div class="card-time">

                <div class="topo-time">

                    <h3>
                        TIME 1
                    </h3>

                    <div
                        class="nota-time"
                        id="notaTime1"
                    >
                        Nota: 0
                    </div>

                </div>

                <div
                    class="campo"
                    id="time1"
                ></div>

                <div class="area-botoes-time">

                    <button
                        onclick="salvarVitoria(1)"
                        class="btn-vitoria"
                    >
                        🏆 Vitória Time 1
                    </button>

                </div>

            </div>

        </div>

        <!-- TIME 2 -->

        <div class="col-lg-4 mb-4">

            <div class="card-time">

                <div class="topo-time">

                    <h3>
                        TIME 2
                    </h3>

                    <div
                        class="nota-time"
                        id="notaTime2"
                    >
                        Nota: 0
                    </div>

                </div>

                <div
                    class="campo"
                    id="time2"
                ></div>

                <div class="area-botoes-time">

                    <button
                        onclick="salvarVitoria(2)"
                        class="btn-vitoria"
                    >
                        🏆 Vitória Time 2
                    </button>

                </div>

            </div>

        </div>

        <!-- TIME 3 -->

        <div class="col-lg-4 mb-4">

            <div class="card-time">

                <div class="topo-time">

                    <h3>
                        TIME 3
                    </h3>

                    <div
                        class="nota-time"
                        id="notaTime3"
                    >
                        Nota: 0
                    </div>

                </div>

                <div
                    class="campo"
                    id="time3"
                ></div>

                <div class="area-botoes-time">

                    <button
                        onclick="salvarVitoria(3)"
                        class="btn-vitoria"
                    >
                        🏆 Vitória Time 3
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
