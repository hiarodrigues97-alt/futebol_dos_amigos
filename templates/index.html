<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futebol dos Amigos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container py-4">
        <h1 class="titulo">⚽ Futebol dos Amigos</h1>
        <div id="mensagem" class="alert d-none" role="alert"></div>

        <section class="card p-4 mb-4">
            <h2 class="h4 mb-3">Novo jogador</h2>
            <div class="row g-2">
                <div class="col-md-5"><input id="nome" class="form-control" maxlength="100" placeholder="Nome"></div>
                <div class="col-md-3">
                    <select id="posicao" class="form-select">
                        <option value="A">Atacante</option><option value="M">Meia</option>
                        <option value="Z">Zagueiro</option><option value="G">Goleiro</option>
                    </select>
                </div>
                <div class="col-md-2"><input id="nota" type="number" min="0" step="0.1" class="form-control" placeholder="Nota"></div>
                <div class="col-md-2"><button type="button" class="btn btn-success w-100" onclick="adicionarJogador()">Adicionar</button></div>
            </div>
        </section>

        <section class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 class="h4 mb-0">🏆 Rankings</h2>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-warning" type="button" onclick="gerarImagem('artilheiros')">Imagem Top 10 artilheiros</button>
                    <button class="btn btn-warning" type="button" onclick="gerarImagem('vitoriosos')">Imagem Top 10 vitoriosos</button>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-md-6"><h3 class="h5">⚽ Artilheiros</h3><div id="rankingArtilheiros"></div></div>
                <div class="col-md-6"><h3 class="h5">🏆 Mais vitórias</h3><div id="rankingVitoriosos"></div></div>
            </div>
        </section>

        <section class="card p-4 mb-4">
            <h2 class="h4 mb-3">Jogadores</h2>
            <div class="table-responsive"><table class="table align-middle">
                <thead><tr><th>Nome</th><th>Pos.</th><th>Gols</th><th>Jogos</th><th>Vitórias</th><th>Nota</th><th>Ações</th></tr></thead>
                <tbody id="listaJogadores"></tbody>
            </table></div>
        </section>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
