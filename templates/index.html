<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container mt-4">

    <h1 class="titulo">
        Futebol dos Amigos ⚽
    </h1>

    <!-- CADASTRO -->

    <div class="card p-4 mb-4">

        <div class="row g-3">

            <div class="col-md-4">

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Nome"
                >

            </div>

            <div class="col-md-3">

                <select
                    id="posicao"
                    class="form-select"
                >

                    <option value="A">Atacante</option>
                    <option value="M">Meia</option>
                    <option value="Z">Zagueiro</option>
                    <option value="G">Goleiro</option>

                </select>

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    step="0.1"
                    id="nota"
                    class="form-control"
                    placeholder="Nota"
                >

            </div>

            <div class="col-md-3">

                <button
                    onclick="addJogador()"
                    class="btn btn-success w-100"
                >
                    Adicionar
                </button>

            </div>

        </div>

    </div>

    <!-- BOTÕES -->

    <div class="d-flex gap-2 mb-4 flex-wrap">

        <button onclick="sortear()" class="btn btn-primary">
            ⚽ Sortear
        </button>

        <button onclick="registrarJogos()" class="btn btn-success">
            🎮 Registrar Jogos
        </button>

        <button onclick="copiarTimes()" class="btn btn-dark">
            📋 Copiar
        </button>

        <button onclick="baixarImagem()" class="btn btn-warning">
            📸 Imagem
        </button>

    </div>

    <!-- RANKING -->

    <div class="card p-4 mb-4">

        <h3>🏆 Ranking Times</h3>

        <div id="rankingTimes"></div>

    </div>

    <!-- DASHBOARD -->

    <div class="card p-4 mb-4">

        <div class="row">

            <div class="col-md-6">

                <h4>
                    ⚽ Top 5 Artilharia
                </h4>

                <div id="topArtilheiros"></div>

            </div>

            <div class="col-md-6">

                <h4>
                    🧤 Goleiro Mais Vazado
                </h4>

                <div id="goleiroVazado"></div>

            </div>

        </div>

    </div>

    <!-- JOGADORES LINHA -->

    <div class="card p-4 mb-4">

        <h3 class="mb-3">
            ⚽ Jogadores de Linha
        </h3>

        <div class="table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th></th>
                        <th>Nome</th>
                        <th>Posição</th>
                        <th>Gols</th>
                        <th>Jogos</th>
                        <th>Vitórias</th>
                        <th>Nota</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaJogadores"></tbody>

            </table>

        </div>

    </div>

    <!-- GOLEIROS -->

    <div class="card p-4 mb-4">

        <h3 class="mb-3">
            🧤 Goleiros
        </h3>

        <div class="table-responsive">

            <table class="table table-striped">

                <thead>

                    <tr>

                        <th></th>
                        <th>Nome</th>
                        <th>Posição</th>
                        <th>Gols Sofridos</th>
                        <th>Jogos</th>
                        <th>Vitórias</th>
                        <th>Nota</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaGoleiros"></tbody>

            </table>

        </div>

    </div>

    <!-- TIMES -->

    <div id="areaTimes" class="row"></div>

</div>

<script src="/static/script.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

</body>
</html>
