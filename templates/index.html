<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Futebol dos Amigos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>

<body>

<div class="container mt-4 mb-5">

    <h1 class="titulo">
        Futebol dos Amigos ⚽
    </h1>

    <!-- CADASTRO -->

    <div class="card p-4 mb-4 shadow-sm">

        <h4 class="mb-3">
            Cadastrar Jogador
        </h4>

        <div class="row g-2">

            <div class="col-md-4">

                <input
                    type="text"
                    id="nome"
                    class="form-control"
                    placeholder="Nome"
                >

            </div>

            <div class="col-md-3">

                <select id="posicao" class="form-control">

                    <option value="A">Atacante</option>

                    <option value="M">Meia</option>

                    <option value="Z">Zagueiro</option>

                    <option value="G">Goleiro</option>

                </select>

            </div>

            <div class="col-md-2">

                <input
                    type="number"
                    step="0.1"
                    id="nota"
                    class="form-control"
                    placeholder="Nota"
                >

            </div>

            <div class="col-md-3">

                <button
                    onclick="addJogador()"
                    class="btn btn-success w-100"
                >
                    Adicionar
                </button>

            </div>

        </div>

    </div>

    <!-- CONTADOR -->

    <div
        class="contador mb-3"
        id="contadorSelecionados"
    >
        Selecionados: 0
    </div>

    <!-- BOTÕES -->

    <div class="mb-4 d-flex gap-2 flex-wrap">

        <button
            onclick="sortear()"
            class="btn btn-primary"
        >
            Sortear Times
        </button>

        <button
            onclick="copiarTimes()"
            class="btn btn-dark"
        >
            Copiar Times
        </button>

    </div>

    <!-- JOGADORES DE LINHA -->

    <div class="card p-3 mb-4 shadow-sm">

        <h3 class="mb-3">
            Ranking Artilheiros ⚽
        </h3>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th></th>

                        <th>Nome</th>

                        <th>Posição</th>

                        <th>Gols</th>

                        <th>Jogos</th>

                        <th>Nota</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaJogadores"></tbody>

            </table>

        </div>

    </div>

    <!-- GOLEIROS -->

    <div class="card p-3 mb-4 shadow-sm">

        <h3 class="mb-3">
            Ranking Goleiro Menos Vazado 🧤
        </h3>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th></th>

                        <th>Nome</th>

                        <th>Posição</th>

                        <th>Gols Sofridos</th>

                        <th>Jogos</th>

                        <th>Nota</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="listaGoleiros"></tbody>

            </table>

        </div>

    </div>

    <!-- TIMES -->

    <div class="row g-3">

        <!-- TIME 1 -->

        <div class="col-md-4">

            <div class="card p-3 h-100 shadow-sm">

                <h3 class="text-center">
                    Time 1 🔵
                </h3>

                <ul
                    id="time1"
                    class="lista-times"
                ></ul>

            </div>

        </div>

        <!-- TIME 2 -->

        <div class="col-md-4">

            <div class="card p-3 h-100 shadow-sm">

                <h3 class="text-center">
                    Time 2 🔴
                </h3>

                <ul
                    id="time2"
                    class="lista-times"
                ></ul>

            </div>

        </div>

        <!-- TIME 3 -->

        <div class="col-md-4">

            <div class="card p-3 h-100 shadow-sm">

                <h3 class="text-center">
                    Time 3 🟢
                </h3>

                <ul
                    id="time3"
                    class="lista-times"
                ></ul>

            </div>

        </div>

    </div>

</div>

<script>

    let TIPO_USUARIO = "admin";

</script>

<script src="/static/script.js"></script>

</body>

</html>
